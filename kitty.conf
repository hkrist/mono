font_family      SF Mono
bold_font        SF Mono Bold
italic_font      SF Mono Italic
bold_italic_font SF Mono Bold Italic

font_size 11.0

symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0C8 symbols-nerd-font-mono

#foreground            #ffffff
#background            #121212
selection_foreground  #000000
selection_background  #ffffff

cursor                #ffffff
cursor_text_color     #000000
cursor_shape          block
cursor_blink_interval 0.5

# URL
url_color             #ffffff
url_style             single

#ASCII

# Black / Gray
#color0  #1c1c1c
#color8  #4e4e4e

# Red -> Light Gray
color1  #888888
color9  #aaaaaa

# Green -> White
color2  #cccccc
color10 #ffffff

# Yellow -> Medium Gray
color3  #a0a0a0
color11 #d0d0d0

# Blue -> Soft White
color4  #e0e0e0
color12 #ffffff

# Magenta -> Dark Gray
color5  #666666
color13 #888888

# Cyan -> Off-White
color6  #d8d8d8
color14 #ffffff

# White / Light Gray
color7  #e5e5e5
color15 #ffffff

window_padding_width 6
confirm_os_window_close 0

background_opacity 0.70

# Bordes
draw_minimal_borders yes
window_border_width 1px
#active_border_color #ffffff
#inactive_border_color #333333

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled

active_tab_foreground   #000000
active_tab_background   #ffffff
active_tab_font_style   bold
inactive_tab_foreground #888888
inactive_tab_background #1c1c1c
inactive_tab_font_style normal

enable_audio_bell no
shell_integration enabled
